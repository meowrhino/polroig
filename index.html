<!doctype html>
<!--
  VISTA PRÈVIA LOCAL
  Aquest fitxer no es publica: la web de debò l'escriu build/build.mjs a GitHub.
  Serveix per revisar els canvis abans de pujar-los, amb Live Server de VS Code
  ("Go Live" a baix a la dreta). Llegeix data/*.json i pinta la pàgina amb les
  mateixes plantilles que el build.
-->
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>vista prèvia — pol roig</title>
</head>
<body style="background:#000;color:#fff;font:18px/1.5 Helvetica,Arial,sans-serif;padding:2em">
  <p id="avis">carregant la vista prèvia…</p>
  <script>
    if (location.protocol === 'file:') document.getElementById('avis').innerHTML =
      'Aquesta pàgina s\'ha d\'obrir amb <b>Live Server</b>: a VS Code, botó <b>Go Live</b> a baix a la dreta.';
  </script>
  <script type="module" src="build/preview.mjs"></script>
</body>
</html>
