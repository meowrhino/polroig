# Cada push a main regenera la web i la publica a meowrhino.github.io/polroig/
# (sense indexar). Només a la nostra còpia: a la de Pol publica Cloudflare
# (wrangler.jsonc) i això no corre. Pol només toca data/ i projects/.
name: build & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'meowrhino'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm ci   # sharp: les imatges per compartir (og:image)
      - run: node build/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
